# BotHunter Configuration File
# SEO Log Analyzer for bot activity analysis and crawl budget optimization
#
# This file provides defaults so you can run `python main.py` without flags.
# All options can be overridden on the command line (see --help).

# ============================================================================
# CORE SETTINGS
# ============================================================================

# Default domain (avoids the --domain flag)
domain: example.com

# Default report format: html, json, both
format: html

# Maximum lines per file (0 = unlimited)
max_lines: 0
