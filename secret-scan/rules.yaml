# secret-scan rules.yaml — the curated built-in rule set.
#
# The same engine and schema a --custom-rules file uses (the wp-audit
# precedent: detection logic as data):
#
#   - id: unique-rule-id               # required
#     description: "…"                 # required
#     severity: critical|high|medium|low
#     secret_type: CLOUD_KEY|VCS_TOKEN|…   # the finding's category
#     message: "Short finding text — what it is, what to do"
#     match:
#       regex: '<pattern>'             # required — must match the line
#     mask_group: 0                    # which regex group holds the
#                                      #   secret (0 = whole match);
#                                      #   masked in every output
#     exclude:                         # optional — suppresses when matched
#       regex: '<pattern>'             #   on the trigger line or up to
#       window_lines: 0                #   window_lines after it
#     require_source:                  # optional — needs one of these
#       window_lines: 15               #   within N lines before trigger
#       patterns: ['<pattern>']
#     file_include: ['*']              # filename globs (default: all)
#     file_exclude: ['…']
#
# YAML quoting: single-quoted strings; a literal single quote inside
# them is doubled: '' → '
#
# Curated to v1 scope: the specific, high-signal shapes — provider
# key formats, private key headers, credentials inside URLs, secret
# assignments with placeholder excludes. Generic entropy scoring is
# deliberately absent: without context it floods the report.

rules:

  # ── cloud & infrastructure ─────────────────────────────────────
  - id: aws-access-key
    description: "AWS access key id (AKIA…)"
    severity: critical
    secret_type: CLOUD_KEY
    message: "An AWS access key id — full account access until rotated"
    match:
      regex: 'AKIA[0-9A-Z]{16}'
    mask_group: 0

  - id: aws-secret-access-key
    description: "AWS secret access key near its keyword"
    severity: critical
    secret_type: CLOUD_KEY
    message: "An AWS secret access key assignment — rotate in IAM and move to env/secrets manager"
    match:
      regex: '(?i)aws.{0,40}?(secret|sk).{0,10}?[''"][A-Za-z0-9/+=]{40}[''"]'
    exclude:
      regex: '(?i)(changeme|example|placeholder|your[_ -]?|<[^>]*>)'
      window_lines: 0
    mask_group: 0

  # ── version-control & registry tokens ─────────────────────────
  - id: github-token
    description: "GitHub personal access / OAuth / app token (ghp_, gho_, ghu_, ghs_)"
    severity: high
    secret_type: VCS_TOKEN
    message: "A GitHub token — repo and possibly org access; revoke at github.com/settings/tokens"
    match:
      regex: 'gh[pousr]_[A-Za-z0-9]{36,255}'
    mask_group: 0

  - id: gitlab-pat
    description: "GitLab personal access token (glpat-)"
    severity: high
    secret_type: VCS_TOKEN
    message: "A GitLab PAT — revoke in Profile → Access Tokens"
    match:
      regex: 'glpat-[A-Za-z0-9_-]{20,}'
    mask_group: 0

  - id: npm-token
    description: "npm registry token (npm_)"
    severity: high
    secret_type: VCS_TOKEN
    message: "An npm token — can publish packages under your name; revoke at npmjs.com → Access Tokens"
    match:
      regex: 'npm_[A-Za-z0-9]{36}'
    mask_group: 0

  # ── chat & messaging ───────────────────────────────────────────
  - id: slack-token
    description: "Slack token (xoxb/xoxp/xoxa/xoxr/xoxt)"
    severity: high
    secret_type: CHAT_TOKEN
    message: "A Slack token — workspace access; rotate at api.slack.com/apps"
    match:
      regex: 'xox[baprste]-[A-Za-z0-9-]{10,}'
    mask_group: 0

  - id: telegram-bot-token
    description: "Telegram bot token (id:hash)"
    severity: high
    secret_type: CHAT_TOKEN
    message: "A Telegram bot token — the bot is fully controllable with it; talk to @BotFather to revoke"
    match:
      regex: '(?<![0-9A-Za-z_-])[0-9]{8,10}:[A-Za-z0-9_-]{35}(?![0-9A-Za-z_-])'
    mask_group: 0

  # ── API & payment keys ────────────────────────────────────────
  - id: google-api-key
    description: "Google API key (AIza…)"
    severity: high
    secret_type: API_KEY
    message: "A Google API key — restrict it in the console or rotate; quota abuse is the usual damage"
    match:
      regex: 'AIza[0-9A-Za-z_-]{35}'
    mask_group: 0

  - id: stripe-live-key
    description: "Stripe live secret/restricted key (sk_live_/rk_live_)"
    severity: critical
    secret_type: PAYMENT_KEY
    message: "A Stripe LIVE key — money-moving access; rotate in the Stripe dashboard immediately"
    match:
      regex: '(sk|rk)_live_[A-Za-z0-9]{20,}'
    mask_group: 0

  - id: sendgrid-api-key
    description: "SendGrid API key (SG.….…)"
    severity: high
    secret_type: API_KEY
    message: "A SendGrid key — sends mail as your domain (the spam & phishing risk); rotate in SendGrid"
    match:
      regex: 'SG\.[A-Za-z0-9_-]{16,32}\.[A-Za-z0-9_-]{16,64}'
    mask_group: 0

  # ── keys & certificates ───────────────────────────────────────
  - id: private-key-block
    description: "A private key PEM header — RSA/EC/DSA/OpenSSH/PGP"
    severity: critical
    secret_type: PRIVATE_KEY
    message: "A private key in the tree — the whole authentication it grants is compromised; replace the keypair"
    match:
      regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----'
    mask_group: 0

  # ── credentials inside URLs ───────────────────────────────────
  - id: url-embedded-credentials
    description: "user:password inside a URL (git remotes, DSNs, scrapers)"
    severity: high
    secret_type: URL_CREDENTIALS
    message: "Credentials embedded in a URL — visible to every process, proxy and log on the way; move them out"
    match:
      regex: '(https?|ssh|ftp)://[^\s:''"@/]{1,64}:[^\s:''"@/]{1,128}@'
    exclude:
      regex: '(?i)(://(user|username|<[^>]*>|\$\{)[^@]*@|x-token:|:token@)'
      window_lines: 0
    mask_group: 0

  - id: database-url-credentials
    description: "postgres/mysql/mongodb/redis URL with a password"
    severity: critical
    secret_type: DB_CREDENTIALS
    message: "A database URL with the password inside — the classic config leak; move it to an env var"
    match:
      regex: '(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqps?)://[^\s:''"@/]{1,64}:[^\s:''"@/]{1,128}@'
    exclude:
      regex: '(?i)(changeme|example|placeholder|password@|:<password>|<[^>]*>)'
      window_lines: 0
    mask_group: 0

  # ── framework & app secrets ───────────────────────────────────
  - id: framework-secret-key
    description: "Django/Flask-style SECRET_KEY with a real-looking value"
    severity: high
    secret_type: FRAMEWORK_SECRET
    message: "A hardcoded framework SECRET_KEY — session forgery and password-reset token forgery live off it"
    match:
      regex: '(?i)secret[_-]?key\s*[:=]\s*[''"][A-Za-z0-9+/_=-]{16,}[''"]'
    exclude:
      regex: '(?i)(changeme|example|placeholder|generate|your[_ -]?|<[^>]*>|\$\{|\{\{)'
      window_lines: 0
    mask_group: 0

  - id: hardcoded-jwt
    description: "A hardcoded JWT (eyJ…)"
    severity: medium
    secret_type: JWT
    message: "A JWT in source — tokens expire, but a committed one is a committed credential; check what it grants"
    match:
      regex: 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{5,}'
    mask_group: 0

  # ── generic assignments & env files ───────────────────────────
  - id: generic-secret-assignment
    description: "password/secret/token/api_key = \"value\" with a real-looking value"
    severity: medium
    secret_type: GENERIC_SECRET
    message: "A secret-looking assignment — placeholder excludes did not match it; verify and move to env/secrets manager"
    match:
      regex: '(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key)\b[''"]?\s*[:=]\s*[''"]([^''"\s]{8,})[''"]'
    mask_group: 2
    exclude:
      regex: '(?i)(changeme|change-me|xxx+|example|placeholder|sample|dummy|your[_ -]?(password|secret|token|key)|insert|redacted|todo|fixme|<[^>]*>|\$\{|\{\{|%[A-Z_]+%|[0-9.]+test)'
      window_lines: 0

  - id: env-file-credentials
    description: "An .env-style file carrying credential keys"
    severity: medium
    secret_type: ENV_FILE
    message: "A .env file with credential keys — .env belongs in .gitignore, the .env.example template in the repo"
    match:
      regex: '^\s*[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|KEY)[A-Z0-9_]*\s*=\s*(.+)'
    mask_group: 2
    file_include: ['*.env', '.env*']
    file_exclude: ['*.example', '*.sample', '*.template']
