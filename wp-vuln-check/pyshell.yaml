schema: 1
id: com.pyshell.wpvulncheck
name: WP Vuln Check
version: 0.1
description: "Known vulnerabilities in the installed WordPress plugins and themes — versions read exactly from the Plugin Name/style.css headers of a wp-content folder (never guessed from the frontend), matched against the Wordfence Intelligence feed (free key via env) with PHP-style version comparison and the patched-backport nuance"
icon: lucide:x-circle
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 300

inputs:
  - key: wp_content
    type: dir
    label: wp-content folder
    help: The wp-content folder from the site (scp it over or point at a local copy) — plugins and themes are read from their headers, the WP core version from wp-includes if a parent folder is given
    required: true
    group: Target
    binding: {kind: arg, flag: "--wp-content", style: space}

  - key: wf_key
    type: secret
    label: Wordfence Intelligence API key
    help: "Free key from wordfence.com (account → Intelligence API). Sent as a Bearer token via WORDFENCE_API_KEY; without it the script exits with instructions instead of imitating a result"
    group: Feed
    binding:
      kind: env
      name: WORDFENCE_API_KEY

  - key: timeout
    type: int
    label: "Feed timeout (s)"
    help: The Wordfence feed is a few MB — the download gets this long
    min: 10
    max: 120
    default: 60
    group: Feed
    binding: {kind: arg, flag: "--timeout", style: space}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
