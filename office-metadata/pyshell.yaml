schema: 1
id: com.pyshell.officemetadata
name: Office Metadata
version: 0.1
description: See what your Word/Excel/PowerPoint files say about you — author, company, editing minutes, sheet and slide names, even the embedded thumbnail — with optional privacy-first stripping to clean copies
icon: lucide:file-json
category: Media

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 300

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One document, several selected files, or a folder
    default: single
    group: Input
    options:
      - {value: single, label: Single document}
      - {value: multiple, label: Multiple documents}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Document
    help: The Office file to inspect (modern formats only — the old binary .doc/.xls/.ppt are not ZIP containers and are not supported)
    extensions: [docx, docm, dotx, xlsx, xlsm, xltx, pptx, pptm, potx]
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Documents
    help: The Office files to inspect (you can select several)
    extensions: [docx, docm, dotx, xlsx, xlsm, xltx, pptx, pptm, potx]
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Document folder
    help: Every Office file in this folder is inspected (other files are noted as skipped)
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

  - key: strip
    type: bool
    label: Also write clean copies (strip metadata)
    help: Saves metadata-free copies to the output folder — the author, company, editor-minutes and thumbnail parts are dropped; the originals are never touched
    default: false
    group: Strip
    binding: {kind: arg, flag: "--strip", style: flag}

  - key: output_folder
    type: dir
    label: Output folder
    help: Where the clean copies land (used only when stripping)
    visible_if:
      op: eq
      key: strip
      value: true
    group: Strip
    binding: {kind: arg, flag: "--output-folder", style: space}

outputs:
  artifacts:
    - "office_metadata.csv"
    - "report.md"
    - "*_clean.*"
  result: markdown
