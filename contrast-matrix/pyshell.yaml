schema: 1
id: com.pyshell.contrastmatrix
name: Contrast Matrix
version: 0.1
description: "Every text/background pair of a palette judged before a single line is written — WCAG 2.2 AA and AAA for body and large text separately, plus APCA (Lc) as the second opinion, and for each failing pair the nearest shade that passes (lightness shifted in HSL until the threshold crosses). Works at the design stage with the full palette — the a11y-check sibling that runs before the page exists"
icon: lucide:calculator
category: Media

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 60

inputs:
  - key: colors
    type: multiline
    label: Colors
    help: "Hex colors, any separator (comma, space, newline) — e.g. the palette Color Palette extracted; takes precedence over the JSON file"
    default: ""
    group: Input
    binding: {kind: arg, flag: "--colors", style: space}

  - key: palette_file
    type: file
    label: "Or color-palette's palette.json"
    help: The palette.json artifact of Color Palette — every hex in it joins the matrix (used when the field above is empty)
    extensions: [json]
    group: Input
    binding: {kind: arg, flag: "--palette-file", style: space}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
