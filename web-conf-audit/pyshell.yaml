schema: 1
id: com.pyshell.webconfaudit
name: Web Conf Audit
version: 0.1
description: "What the web server config actually allows — saved nginx, apache and .htaccess files reviewed passively: directory listings, version banners, TLS protocols and ciphers on the tls-audit scale, PHP inside uploads, missing security headers, upload size limits, compression, proxy Host mistakes"
icon: lucide:settings
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 120

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One config, several selected files, or a folder — nginx, apache and .htaccess formats are detected automatically
    default: single
    group: Input
    options:
      - {value: single, label: Single config}
      - {value: multiple, label: Multiple configs}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Config file
    help: A saved nginx.conf/site config, apache2.conf/vhost, or .htaccess
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Config files
    help: The configs to review (you can select several)
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Config folder
    help: Every file in this folder is sniffed; files that match no web-server format are noted as skipped
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
