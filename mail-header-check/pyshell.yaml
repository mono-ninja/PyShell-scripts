schema: 1
id: com.pyshell.mailheadercheck
name: Mail Header Check
version: 0.1
description: Why a mail landed where it did — SPF/DKIM/DMARC verdicts from Authentication-Results with alignment analysis, the Received hop chain with per-hop delays and TLS markers, phishing signals and attachment flags — read from the .eml file, nothing sent anywhere
icon: lucide:at-sign
category: Network

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 120

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One message, several selected files, or a folder
    default: single
    group: Input
    options:
      - {value: single, label: Single message}
      - {value: multiple, label: Multiple messages}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Message (.eml)
    help: The saved message to analyze (raw .eml — Outlook's binary .msg is a different format and is not supported)
    extensions: [eml]
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Messages (.eml)
    help: The saved messages to analyze (you can select several)
    extensions: [eml]
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Message folder
    help: Every .eml in this folder is analyzed (other files are noted as skipped)
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
