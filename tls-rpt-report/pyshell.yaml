schema: 1
id: com.pyshell.tlsrptreport
name: TLS RPT Report
version: 0.1
description: "Which receivers could not raise TLS to your MX — the RFC 8460 SMTP TLS reports (.json, .json.gz, .zip) merged: failure types (starttls-not-supported, certificate-expired, validation-failure, sts-policy-invalid), the sending MTAs behind them, successes vs failures, and what the numbers mean for your MTA-STS policy — the sixth act of the mail story, dmarc-report's twin"
icon: lucide:cloud-upload
category: Network

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 120

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One report, several selected files, or a folder — .json, .json.gz and .zip all work
    default: single
    group: Input
    options:
      - {value: single, label: Single report}
      - {value: multiple, label: Multiple reports}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Report file
    help: "The TLS-RPT aggregate report as saved from the mailbox: .json, .json.gz, or a .zip"
    extensions: [json, gz, zip]
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Report files
    help: The reports to merge (you can select several)
    extensions: [json, gz, zip]
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Report folder
    help: Every report-like file in this folder is read; other files are noted as skipped
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
