schema: 1
id: com.pyshell.pdftoolkit
name: PDF Toolkit
version: 0.1
description: Merge, split, extract, rotate, metadata-strip and compress PDFs — privacy-first, the metadata a PDF leaks about you (author, producer, dates, attachments) is shown before it's removed
icon: lucide:file
category: Media

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 600

inputs:
  - key: operation
    type: choice
    label: Operation
    help: What to do with the PDF(s)
    default: strip
    group: Operation
    options:
      - {value: strip, label: "Strip metadata (privacy)"}
      - {value: merge, label: Merge PDFs into one}
      - {value: split, label: "Split into one PDF per page"}
      - {value: extract, label: "Extract page ranges into a new PDF"}
      - {value: rotate, label: Rotate pages}
      - {value: compress, label: "Compress (dedupe + strip)"}
    binding: {kind: arg, flag: "--operation", style: space}

  - key: pdfs
    type: files
    label: PDF files
    help: One or more PDFs, in order — merge joins them all; every other operation runs on each file separately
    extensions: [pdf]
    required: true
    group: Operation
    binding: {kind: arg, flag: "--pdfs", style: repeat}

  - key: pages
    type: string
    label: "Pages (e.g. 1-3,7,10-)"
    help: 1-based, ranges allowed, comma-separated — required for extract; for rotate empty means all pages
    default: ""
    group: Pages
    binding: {kind: arg, flag: "--pages", style: space}

  - key: angle
    type: choice
    label: Rotation
    options:
      - {value: "90", label: "90° clockwise"}
      - {value: "180", label: "180°"}
      - {value: "270", label: "270° (= 90° counter-clockwise)"}
    default: "90"
    visible_if:
      op: eq
      key: operation
      value: rotate
    group: Pages
    binding: {kind: arg, flag: "--angle", style: space}

  - key: output_dir
    type: dir
    label: "Output folder (optional)"
    help: Where the results land — defaults to PyShell's output directory, or the current folder standalone
    group: Output
    binding: {kind: arg, flag: "--output-dir", style: space}

outputs:
  artifacts:
    - "merged.pdf"
    - "*_page_*.pdf"
    - "*_extracted.pdf"
    - "*_rotated.pdf"
    - "*_clean.pdf"
    - "*_min.pdf"
    - "pdf_toolkit_results.json"
  result: markdown
