schema: 1
id: com.pyshell.fontsubset
name: Font Subset
version: 0.1
description: "A font cut to the glyphs a page actually serves — by language subsets (latin, latin-ext, cyrillic, greek, vietnamese — Google's ranges, one woff2 per subset with unicode-range so the browser downloads only what it renders), by a text sample, or by the glyphs really used in scanned HTML/CSS — saved as woff2 (97%+ support) with the ready @font-face (font-display: swap) and the measured savings; plus an inventory mode: families, weights, styles and per-language coverage of a font file, with what the pages actually use. Montserrat-shape savings: 64.6 KB → 15 KB"
icon: lucide:download
category: Media

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 300

inputs:
  - key: mode
    type: choice
    label: Mode
    help: "Subset — cut the font and get woff2 + @font-face; Inventory — what the font contains: families, weights, per-language coverage, what the pages use"
    default: subset
    group: Input
    options:
      - {value: subset, label: Subset}
      - {value: inventory, label: Inventory}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: font_file
    type: file
    label: Font file
    help: TTF, OTF, WOFF or WOFF2 — the original is never touched; the subsets land in the output folder
    extensions: [ttf, otf, woff, woff2]
    required: true
    group: Input
    binding: {kind: arg, flag: "--font-file", style: space}

  - key: subsets
    type: multi_choice
    label: Language subsets
    help: "One woff2 per selected subset, each with its unicode-range — the browser downloads only the ranges it renders (when no text or files are given)"
    default: [latin]
    visible_if:
      op: eq
      key: mode
      value: subset
    group: Subset by
    options:
      - {value: latin, label: "Latin"}
      - {value: latin-ext, label: "Latin Extended"}
      - {value: cyrillic, label: "Cyrillic"}
      - {value: cyrillic-ext, label: "Cyrillic Extended"}
      - {value: greek, label: "Greek"}
      - {value: greek-ext, label: "Greek Extended"}
      - {value: vietnamese, label: "Vietnamese"}
    binding: {kind: arg, flag: "--subset", style: repeat}

  - key: text_sample
    type: multiline
    label: Or by text sample
    help: "Paste the text the font must cover (a slogan, the whole page copy) — one woff2 with exactly those glyphs, no unicode-range; takes precedence over the language subsets"
    default: ""
    visible_if:
      op: eq
      key: mode
      value: subset
    group: Subset by
    binding: {kind: arg, flag: "--text-sample", style: space}

  - key: scan_files
    type: files
    label: Or by pages actually served
    help: "HTML/CSS files scanned for the glyphs really used (text nodes included, tags and CSS syntax excluded where separable) — the honest 'what the site needs' cut; takes precedence over everything else. In inventory mode it adds the what-the-pages-use column"
    extensions: [html, htm, css, txt, md, json]
    group: Subset by
    binding: {kind: arg, flag: "--scan-file", style: repeat}

outputs:
  artifacts:
    - "*.woff2"
    - "fontface.css"
    - "findings.json"
    - "report.md"
  result: markdown
