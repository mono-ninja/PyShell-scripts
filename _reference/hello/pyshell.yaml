schema: 1
id: com.pyshell.example.hello
name: Hello Example
description: A simple script with 3 input fields
icon: 👋
category: Examples
runtime:
  entry: main.py
  python: '>=3.11,<3.14'
inputs:
- key: name
  type: string
  label: Name
  help: Who to greet
  required: true
  default: World
  binding:
    kind: arg
    flag: --name
    style: space
- key: count
  type: int
  min: 1
  max: 100
  label: Count
  help: Number of greetings
  required: true
  default: 1
  binding:
    kind: arg
    flag: --count
    style: space
- key: uppercase
  type: bool
  label: Uppercase
  help: Convert greeting to uppercase
  required: false
  default: false
  binding:
    kind: arg
    flag: --uppercase
    style: flag
outputs:
  artifacts: []
  result: none
