  - {id: js-framework, label: JS framework,         order: 40}
  - {id: ssr,          label: SSR / meta-framework, order: 45}
  - {id: js-library,   label: JS library,           order: 50}
  - {id: ui,           label: UI kit,               order: 55}
  - {id: build,        label: Build tool,           order: 60}
