schema: 1
id: com.pyshell.fwaudit
name: FW Audit
version: 0.1
description: What the firewall rules actually allow — ufw, iptables, pf and firewalld dumps reviewed passively — default policies, the ports open to the world grouped by risk, rules scoped to a source, IPv6 parity, shadowed allows; the rules-vs-reality companion to Port Check
icon: lucide:server
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 300

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One dump, several selected files, or a folder — the format of each file is detected automatically
    default: single
    group: Input
    options:
      - {value: single, label: Single dump}
      - {value: multiple, label: Multiple dumps}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Firewall dump
    help: "A saved config dump: `ufw status verbose`, `iptables-save`, a pf.conf, or `firewall-cmd --list-all` output — how to export each is in the docs"
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Firewall dumps
    help: The dumps to review (you can select several)
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Dump folder
    help: Every file in this folder is sniffed; files that match no firewall format are noted as skipped
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
