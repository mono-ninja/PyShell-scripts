schema: 1
id: com.pyshell.cspaudit
name: CSP Audit
version: 0.1
description: "How strong the Content-Security-Policy really is — the Google-CSP-Evaluator-style deep dive: unsafe-inline/unsafe-eval with the nonce nuance, wildcards, the bypass hosts in your allowlist (a curated YAML: unpkg, raw.githubusercontent, JSONP CDNs), missing base-uri/object-src/frame-ancestors, strict-dynamic, policies delivered by <meta http-equiv> as well as headers, and the Report-Only vs enforced diff"
icon: lucide:file-code
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 120

inputs:
  - key: url
    type: string
    label: URL
    help: The page whose Content-Security-Policy (and Report-Only twin) to dissect — one fetch
    required: true
    group: Target
    binding: {kind: arg, flag: "--url", style: space}

  - key: timeout
    type: int
    label: "Per-request timeout (s)"
    min: 3
    max: 60
    default: 15
    group: Target
    binding: {kind: arg, flag: "--timeout", style: space}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
