# Tech Stack — довідник EOL і вразливих діапазонів.
#
# Два розділи:
#   eol       — дата завершення підтримки технології. Версія <= EOL-гілці →
#               «застаріле». Поле `branch` — остання підтримувана гілка, `eol` —
#               ISO-дата. Звіт показує дату бази (`updated`), бо довідник
#               протухає: EOL-дати PHP/nginx/Node змінюються щоквартал.
#   vuln      — вразливі діапазони JS-бібліотек (VERSION_RULES). `min_secure` —
#               перша версія без перелічених CVE; `ranges` — опційні межі, коли
#               перша версія без перелічених CVE; `ranges` — опційні межі, коли
#               вразливість стосується лише частини гілок (напр. Bootstrap 3.x/4.x).
#
# `--online-eol` (endoflife.date) — опційне свіже джерело; цей файл — офлайн-база.

updated: 2026-08-27

