schema: 1
id: com.pyshell.dmarcreport
name: DMARC Report
version: 0.1
description: "What the whole internet sees when it gets mail from your domain — aggregate RUA reports (.xml, .xml.gz, .zip) from every receiver merged into one picture: who sends as you, SPF/DKIM alignment per source, forwarders behind the failures that aren't spoofing, and whether the domain is ready to move p=none → quarantine → reject"
icon: lucide:pie-chart
category: Network

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  timeout: 300

inputs:
  - key: input_mode
    type: choice
    label: Source
    help: One report, several selected files, or a folder — .xml, .xml.gz and .zip (with several reports inside) all work
    default: single
    group: Input
    options:
      - {value: single, label: Single report}
      - {value: multiple, label: Multiple reports}
      - {value: folder, label: Folder}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: single_file
    type: file
    label: Report file
    help: "The RUA aggregate report as saved from the mailbox: .xml, .xml.gz, or the .zip Google and others send"
    extensions: [xml, gz, zip]
    visible_if:
      op: eq
      key: input_mode
      value: single
    group: Input
    binding: {kind: arg, flag: "--single-file", style: space}

  - key: multiple_files
    type: files
    label: Report files
    help: The reports to merge (you can select several)
    extensions: [xml, gz, zip]
    visible_if:
      op: eq
      key: input_mode
      value: multiple
    group: Input
    binding: {kind: arg, flag: "--input-file", style: repeat}

  - key: input_folder
    type: dir
    label: Report folder
    help: Every report-like file in this folder is read (xml, xml.gz, zip); other files are noted as skipped
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--input-folder", style: space}

  - key: recursive
    type: bool
    label: Recursive (with subfolders)
    default: false
    visible_if:
      op: eq
      key: input_mode
      value: folder
    group: Input
    binding: {kind: arg, flag: "--recursive", style: flag}

  - key: resolve_ptr
    type: bool
    label: Resolve source hostnames (PTR)
    help: "OFF by default. When on: each source IP gets a reverse-DNS lookup — the only network this script ever does; without it everything stays offline"
    default: false
    group: Analysis
    binding: {kind: arg, flag: "--resolve-ptr", style: flag}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
