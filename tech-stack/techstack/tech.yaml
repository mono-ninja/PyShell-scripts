# Tech Stack — курована база сигнатур технологій.
#
# Дані тут, а не в Python, бо кожне оновлення бази не має бути правкою коду й
# рев'ю Python-дифу. Поле `updated`
# потрапляє у звіт, бо база застаріває.
#
# Схема навмисно ізоморфна upstream-базі enthec/webappanalyzer: ті самі вектори
# звуться `header/cookie/meta/html/script/inline_script/stylesheet/url_path/
# js_global`, а версія вирізається групою `version_group`. Це робить конвертер
# роботою на години, а не на тиждень.
#
# `where` може бути: header | cookie | meta | html | script (URL <script src>) |
# inline_script | stylesheet | url_path | js_global (тільки під --render).
#   - header:    потребує `name` (ім'я заголовка, lower-case)
#   - cookie:    потребує `name` (ім'я cookie); шукає по імені, не значенню
#   - meta:      потребує `name` (name або property, lower-case)
#   - js_global: потребує `expr` (шлях у window) + `pattern`; `requires: render`
#
# `version_group` — індекс групи регулярки, де сидить версія.
# `confidence` — 0..100 внесок одного сигналу; накопичується як 1-Π(1-cᵢ).
# `implies`    — похідна технологія, confidence не вища за джерело.
# `excludes`   — конфлікт (Apache + IIS), лишається сильніший сигнал.
# `negative`   — негативний сигнал: збіг прибирає технологію.
# `requires`   — `render` — сигнал працює лише з --render.

version: 1
updated: 2026-08-27

categories:
  - {id: server,       label: Web server,           order: 10}
  - {id: language,     label: Language / runtime,   order: 20}
  - {id: cms,          label: CMS,                  order: 30}
