schema: 1
id: com.pyshell.passwordcheck
name: Password Check
version: 0.1
description: Check a password against known breaches via HIBP k-anonymimity — only a 5-character SHA-1 prefix ever leaves the machine — plus entropy analysis and strong password generation
icon: lucide:hash
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 60

inputs:
  - key: mode
    type: choice
    label: Mode
    help: Check one password against breaches and entropy, or generate strong ones
    default: check
    group: Mode
    options:
      - {value: check, label: Check a password}
      - {value: generate, label: Generate passwords}
    binding: {kind: arg, flag: "--mode", style: space}

  - key: password
    type: secret
    label: Password
    help: The password to check — stored in the Keychain, passed via env, never on argv. Only its 5-character SHA-1 prefix is ever sent (HIBP k-anonymimity); the analysis output masks it
    required: true
    visible_if:
      op: eq
      key: mode
      value: check
    group: Mode
    binding: {kind: env, name: PASSWORD}

  - key: generate_length
    type: int
    label: Length
    help: Characters per generated password
    min: 8
    max: 128
    default: 20
    visible_if:
      op: eq
      key: mode
      value: generate
    group: Generate
    binding: {kind: arg, flag: "--generate-length", style: space}

  - key: generate_count
    type: int
    label: How many
    min: 1
    max: 20
    default: 3
    visible_if:
      op: eq
      key: mode
      value: generate
    group: Generate
    binding: {kind: arg, flag: "--generate-count", style: space}

  - key: include_symbols
    type: bool
    label: Include symbols
    help: "!@#$%^&*… in the generated alphabet"
    default: true
    visible_if:
      op: eq
      key: mode
      value: generate
    group: Generate
    binding: {kind: arg, flag: "--include-symbols", style: flag}

  - key: timeout
    type: int
    label: "HIBP timeout (s)"
    help: How long to wait for the breach-database range server
    min: 1
    max: 30
    default: 10
    group: Query
    binding: {kind: arg, flag: "--timeout", style: space}

outputs:
  result: markdown
