# csp-audit bypass_hosts.yaml — hosts that can serve attacker-
# controlled or arbitrary script, and therefore punch holes in any
# script-src allowlist that includes them.
#
# The same schema a future --custom-bypasses file could use:
#
#   - host: "*.example.com"     # wildcard subdomain
#     reason: "why script from here is effectively arbitrary"
#
# Curated to the classics (Google CSP Evaluator's list + the JSONP
# family). Match rule: a wildcard entry ("*.github.io") covers that
# domain and its subdomains; a bare entry ("unpkg.com") matches the
# host exactly — no subdomains unless the entry says so. The first
# entry that matches a source explains it, so keep the specific
# entries above the general ones.

hosts:
  - host: "*.google.com"
    reason: "JSONP endpoints — a callback parameter turns a fetch into arbitrary script execution"


  - host: "raw.githubusercontent.com"
    reason: "any user's repository content — attacker-uploaded script, served with your blessing"

  - host: "*.github.io"
    reason: "GitHub Pages — anyone can host anything on a subdomain"

  - host: "unpkg.com"
    reason: "serves any npm package at any version — an attacker publishes a package, your allowlist imports it"

  - host: "cdn.jsdelivr.net"
    reason: "any npm or GitHub package at any version — same shape as unpkg"

  - host: "cdnjs.cloudflare.com"
    reason: "any library at any version — including the old, vulnerable ones"

  - host: "pastebin.com"
    reason: "raw pastes are valid script sources"

  - host: "*.storage.googleapis.com"
    reason: "public buckets host arbitrary content"

  - host: "*.googleapis.com"
    reason: "the AJAX/JSONP host family — a callback parameter turns a fetch into arbitrary script, and subdomains serve user content"

  - host: "*.amazonaws.com"
    reason: "S3 buckets host arbitrary content — subdomains are user-controlled"

  - host: "cdn.ampproject.org"
    reason: "serves user-submitted AMP extensions"
