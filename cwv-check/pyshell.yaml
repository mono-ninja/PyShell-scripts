schema: 1
id: com.pyshell.cwvcheck
name: CWV Check
version: 0.1
description: "What real Chrome users experience — LCP/INP/CLS p75 from the CrUX field data (phone and desktop separately), the URL-or-origin fallback said aloud, the 25-week trend as a chart, and the lab-vs-field headline: Server Timing and HAR Analyze say what is slow in the lab, this says whether the field sees it"
icon: lucide:bar-chart
category: SEO

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 300

inputs:
  - key: url
    type: string
    label: URL
    help: The page (or site origin) to look up in the Chrome UX Report field data
    required: true
    group: Target
    binding: {kind: arg, flag: "--url", style: space}

  - key: api_key
    type: secret
    label: CrUX API key
    help: "Free Google API key (150 rps): console.cloud.google.com → enable Chrome UX Report API → Credentials. Sent via CRUX_API_KEY; without it the script exits with instructions instead of imitating a result"
    group: Feed
    binding:
      kind: env
      name: CRUX_API_KEY

  - key: timeout
    type: int
    label: "Per-request timeout (s)"
    min: 5
    max: 60
    default: 30
    group: Feed
    binding: {kind: arg, flag: "--timeout", style: space}

outputs:
  artifacts:
    - "findings.json"
    - "report.md"
  result: markdown
