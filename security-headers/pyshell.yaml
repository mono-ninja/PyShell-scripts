schema: 1
id: com.pyshell.securityheaders
name: Security Headers
version: 1
description: Grade a URL's HTTP security headers (HSTS, CSP, cookie flags, …) and list concrete fixes
icon: lucide:shield-check
category: Security

runtime:
  entry: main.py
  python: ">=3.11,<3.15"
  requirements: requirements.txt
  timeout: 60

inputs:
  - key: url
    type: url
    label: URL
    help: Full address including scheme (https://…) — the page whose headers get graded
    required: true
    group: Request
    binding: {kind: arg, flag: "--url", style: space}

  - key: follow_redirects
    type: bool
    label: Follow redirects
    help: Audit the whole redirect chain — headers dropped by a redirect are surfaced as findings
    default: true
    group: Request
    binding: {kind: arg, flag: "--follow-redirects", style: flag}

  - key: timeout
    type: int
    label: "Timeout (s)"
    help: Per-request timeout (the redirect chain gets one timeout per hop)
    min: 1
    max: 120
    default: 15
    group: Request
    binding: {kind: arg, flag: "--timeout", style: space}

  - key: user_agent
    type: string
    label: User-Agent
    help: "Defaults to a PyShell audit identity — some WAFs silently drop bare python-requests"
    group: Request
    binding: {kind: arg, flag: "--user-agent", style: space}

  - key: extra_headers
    type: multiline
    label: Extra request headers
    help: 'One "Key: Value" per line — e.g. a session Cookie for auditing pages behind auth'
    group: Request
    binding: {kind: arg, flag: "--headers", style: space}

  - key: insecure
    type: bool
    label: Skip TLS verification
    help: For internal/staging hosts with self-signed certificates
    default: false
    group: Request
    binding: {kind: arg, flag: "--insecure", style: flag}

outputs:
  artifacts:
    - "headers_raw.json"
    - "findings.json"
    - "report.md"
  result: markdown
